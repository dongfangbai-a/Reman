<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>上下文样本</title>
<style>
	:root {
		--fg: #1f2328; --fg-2: #59636e; --fg-3: #8b949e; --line: #d8dee4; --bg-2: #f6f8fa; --bg-3: #eef1f4;
		--accent: #0969da; --ok: #1a7f37; --bad: #cf222e; --warn: #9a6700; --new: #8250df;
	}
	* { box-sizing: border-box; }
	body { margin: 0; font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--fg); display: flex; height: 100vh; }
	code, pre, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
	pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
	button { font: inherit; }
	#side { width: 320px; flex-shrink: 0; border-right: 1px solid var(--line); overflow-y: auto; background: var(--bg-2); }
	#side header { padding: 12px 14px 8px; color: var(--fg-2); font-size: 12px; }
	#side header b { color: var(--fg); font-size: 14px; display: block; }
	.sample { border-top: 1px solid var(--line); }
	.sample > .title { padding: 8px 14px 4px; font-weight: 600; display: flex; gap: 6px; align-items: baseline; }
	.sample > .title .error { color: var(--bad); font-weight: normal; font-size: 12px; }
	.request { display: flex; gap: 8px; align-items: center; padding: 3px 14px 3px 20px; cursor: pointer; }
	.request:hover { background: var(--bg-3); }
	.request.selected { background: #ddf4ff; }
	.request .who { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.request .ratio { color: var(--fg-3); font-size: 12px; }
	.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--fg-3); }
	.dot.ok { background: var(--ok); }
	.dot.bad { background: var(--bad); }
	.tag { font-size: 11px; padding: 0 5px; border-radius: 8px; background: var(--bg-3); color: var(--fg-2); }
	.tag.optimization { background: #fff1e5; color: #bc4c00; }
	.tag.summary { background: #e8f0fe; color: #1f52b5; }
	.summary-info { color: #1f52b5; margin-right: 6px; }
	#main { flex: 1; overflow-y: auto; padding: 16px 24px 48px; }
	h1 { font-size: 18px; margin: 0 0 4px; }
	h2 { font-size: 14px; margin: 20px 0 6px; }
	.muted { color: var(--fg-2); }
	.box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 8px 0; }
	.box.ok { border-color: #aceebb; background: #f0fff4; }
	.box.bad { border-color: #ffcecb; background: #fff5f5; }
	.box.error { border-color: #ffcecb; background: #fff5f5; color: var(--bad); }
	.box ul { margin: 4px 0; padding-left: 20px; }
	.row { display: flex; gap: 8px; align-items: baseline; padding: 3px 8px; border-left: 3px solid transparent; cursor: pointer; }
	.row:hover { background: var(--bg-2); }
	.row .n { color: var(--fg-3); width: 28px; text-align: right; flex-shrink: 0; }
	.row .text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.row .tokens { color: var(--fg-3); flex-shrink: 0; font-size: 12px; }
	.row.same { border-left-color: var(--line); }
	.row.same .text { color: var(--fg-2); }
	.row.first { border-left-color: var(--accent); background: #f1f8ff; }
	.row.first.bad { border-left-color: var(--bad); background: #fff5f5; }
	.row.after { border-left-color: var(--new); }
	.detail { margin: 2px 0 8px 39px; padding: 8px 10px; background: var(--bg-2); border-radius: 6px; }
	.section { margin-top: 10px; font-weight: 600; color: var(--fg-2); font-size: 12px; padding-left: 8px; }
	.legend { display: flex; gap: 14px; color: var(--fg-2); font-size: 12px; margin: 4px 0; }
	.legend span::before { content: ""; display: inline-block; width: 3px; height: 12px; margin-right: 5px; vertical-align: -2px; }
	.legend .l-same::before { background: var(--line); }
	.legend .l-first::before { background: var(--accent); }
	.legend .l-bad::before { background: var(--bad); }
	.legend .l-after::before { background: var(--new); }
	.v-key { color: #953800; }
	.v-str { color: var(--fg); }
	.v-num { color: var(--accent); }
	.v-obj { padding-left: 14px; border-left: 1px dotted var(--line); }
	.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
	.compare > div { min-width: 0; }
	.diff { background: #fff8c5; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; }
	.diff del { background: #ffcecb; text-decoration: none; }
	.diff ins { background: #aceebb; text-decoration: none; }
	details summary { cursor: pointer; }
	.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
	.changed { color: var(--warn); font-weight: 600; }
	.hint { color: var(--fg-3); font-size: 12px; }
</style>
</head>
<body>
<nav id="side"></nav>
<main id="main"></main>
<script>
const DATA = /*SAMPLES*/null;
const SECTION_NAMES = { prefix: '开头（规则；成员设定、记忆、运行环境、通讯录）', timeline: '时间线', task: '压缩任务' };
let selected = null;

const escape = text => String(text).replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char]);
const tokens = count => count >= 1000 ? `${(count / 1000).toFixed(1)}k` : String(count);
const percent = (part, total) => total > 0 ? `${Math.round(part / total * 100)}%` : '—';

function status(request) {
	const comparison = request.comparison;
	if (!comparison) return '';
	return comparison.broken.length > 0 ? 'bad' : 'ok';
}

function renderSide() {
	const total = DATA.samples.reduce((sum, sample) => sum + sample.requests.length, 0);
	const html = [`<header><b>上下文样本</b>${DATA.samples.length} 个情景，${total} 次请求 · 生成于 ${new Date(DATA.generatedAt).toLocaleString()}</header>`];
	DATA.samples.forEach((sample, sampleIndex) => {
		html.push(`<div class="sample"><div class="title" title="${escape(sample.description)}">${escape(sample.title)}${sample.error ? '<span class="error">出错</span>' : ''}</div>`);
		for (const request of sample.requests) {
			const comparison = request.comparison;
			const ratio = comparison ? `缓存 ${percent(comparison.cachedTokens, request.totalTokens)}` : '第一次';
			const isSelected = selected && selected[0] === sampleIndex && selected[1] === request.index;
			html.push(`<div class="request${isSelected ? ' selected' : ''}" data-sample="${sampleIndex}" data-request="${request.index}">
				<span class="dot ${status(request)}"></span>
				<span class="who">${request.index + 1}. ${escape(request.member)} 第 ${request.memberIndex} 次</span>
				${request.kind === 'optimization' ? '<span class="tag optimization">压缩</span>' : ''}
				<span class="ratio">${ratio}</span></div>`);
		}
		if (sample.requests.length === 0) html.push('<div class="request muted">没有请求</div>');
		html.push('</div>');
	});
	const side = document.getElementById('side');
	const scroll = side.scrollTop;
	side.innerHTML = html.join('');
	side.scrollTop = scroll;
}

/** JSON 原样展开，文字里的换行照实显示。 */
function renderValue(value) {
	if (value === null || typeof value !== 'object') {
		if (typeof value === 'string') return `<pre class="v-str">${escape(value)}</pre>`;
		return `<span class="v-num">${escape(JSON.stringify(value))}</span>`;
	}
	const entries = Array.isArray(value) ? value.map((item, index) => [index, item]) : Object.entries(value);
	if (entries.length === 0) return `<span class="v-num">${Array.isArray(value) ? '[]' : '{}'}</span>`;
	return `<div class="v-obj">${entries.map(([key, item]) => {
		const inline = item === null || typeof item !== 'object';
		return inline && !(typeof item === 'string' && item.includes('\n'))
			? `<div><span class="v-key">${escape(key)}</span>: ${typeof item === 'string' ? `<span class="v-str">${escape(item)}</span>` : renderValue(item)}</div>`
			: `<div><span class="v-key">${escape(key)}</span>:${renderValue(item)}</div>`;
	}).join('')}</div>`;
}

/** 两个值第一处不同的地方，前后各带一段。 */
function firstDifference(before, after) {
	const left = JSON.stringify(before, null, 1);
	const right = JSON.stringify(after, null, 1);
	let start = 0;
	while (start < left.length && left[start] === right[start]) start++;
	let end = 0;
	while (end < left.length - start && end < right.length - start && left[left.length - 1 - end] === right[right.length - 1 - end]) end++;
	const clip = text => text.length > 300 ? `${text.slice(0, 300)}…` : text;
	const context = left.slice(Math.max(0, start - 80), start);
	return `<div class="diff mono">第一处不同：…${escape(context)}<del>${escape(clip(left.slice(start, left.length - end)))}</del><ins>${escape(clip(right.slice(start, right.length - end)))}</ins>${escape(left.slice(left.length - end, left.length - end + 40))}…</div>`;
}

/** 摘要那一行开头：标签，换个颜色写代替了哪段时间、多少字、代替了几项，后面才是摘要的开头。 */
function summaryInfo(summary) {
	const replaced = summary.replaced ? ` · 代替 ${summary.replaced.count} 项，约 ${tokens(summary.replaced.tokens)} token` : '';
	return `<span class="tag summary">摘要</span> <span class="summary-info">${escape(summary.range)} · ${summary.length} 字${replaced}</span> `;
}

function renderMain() {
	const main = document.getElementById('main');
	if (!selected) {
		main.innerHTML = `<h1>上下文样本</h1><p class="muted">左边选一次请求。绿点表示和这个成员的上一次请求比，上一次的输入原样留下、后面追加了新内容；红点表示开头或时间线里已有的内容变了、工具列表变了或者换了模型，缓存从那里断开。</p>${
			DATA.samples.filter(sample => sample.error).map(sample => `<div class="box error"><b>${escape(sample.title)}</b> 出错<pre>${escape(sample.error)}</pre></div>`).join('')}`;
		return;
	}
	const sample = DATA.samples[selected[0]];
	const request = sample.requests[selected[1]];
	const comparison = request.comparison;
	const previous = comparison ? sample.requests[comparison.previous] : null;
	const html = [
		`<h1>${escape(request.member)}的第 ${request.memberIndex} 次请求${request.kind === 'optimization' ? '（压缩请求）' : ''}</h1>`,
		`<div class="muted">${escape(sample.title)}：${escape(sample.description)}</div>`,
	];
	if (sample.error) html.push(`<div class="box error">这个情景出错了<pre>${escape(sample.error)}</pre></div>`);

	html.push('<h2>这次请求之前</h2>');
	html.push(request.notes.length > 0 ? `<div class="box"><ul>${request.notes.map(note => `<li>${escape(note)}</li>`).join('')}</ul></div>` : '<div class="hint">（接着上一次请求）</div>');

	html.push('<h2>和上一次比</h2>');
	if (!comparison) {
		html.push(`<div class="box">这是${escape(request.member)}的第一次请求。约 ${tokens(request.totalTokens)} token，其中工具列表 ${tokens(request.toolsTokens)}。</div>`);
	} else {
		const bad = comparison.broken.length > 0;
		const lines = [
			`和${escape(previous.member)}的第 ${previous.memberIndex} 次请求（左边第 ${previous.index + 1} 项）比：`,
			bad ? `<ul>${comparison.broken.map(item => `<li>${escape(item)}</li>`).join('')}</ul>` : '<div>上一次的输入原样留下，后面追加了新内容。</div>',
			request.toolSet === previous.toolSet
				? `<div>开头相同的部分约 ${tokens(comparison.cachedTokens)} token，占这次的 ${percent(comparison.cachedTokens, request.totalTokens)}：工具列表都一样，输入的前 ${comparison.same} 项一样（这次共 ${request.items.length} 项，上一次 ${previous.items.length} 项）。</div>`
				: `<div>开头相同的部分约 ${tokens(comparison.cachedTokens)} token，占这次的 ${percent(comparison.cachedTokens, request.totalTokens)}：只有工具列表的前 ${comparison.sameTools} 个一样，后面的输入都在变了的工具之后。输入本身的前 ${comparison.same} 项和上一次一样。</div>`,
		];
		if (comparison.params.length > 0) lines.push(`<div>参数变了：${comparison.params.map(key => `<code>${escape(key)}</code>：${escape(JSON.stringify(previous.params[key]) ?? '无')} → ${escape(JSON.stringify(request.params[key]) ?? '无')}`).join('；')}</div>`);
		const { added, removed, changed } = comparison.tools;
		if (added.length + removed.length + changed.length > 0) {
			lines.push(`<div>工具：${[added.length ? `新增 ${added.join('、')}` : '', removed.length ? `去掉 ${removed.join('、')}` : '', changed.length ? `改了 ${changed.join('、')}` : ''].filter(Boolean).join('；')}</div>`);
		}
		html.push(`<div class="box ${bad ? 'bad' : 'ok'}">${lines.join('')}</div>`);
		const change = comparison.change;
		if (change?.kind === 'changed') {
			const [before] = comparison.before;
			const after = request.items[comparison.same];
			html.push(`<details open><summary>第 ${comparison.same + 1} 项：上一次和这一次</summary>${after ? firstDifference(before.value, after.value) : ''}<div class="compare">
				<div><div class="hint">上一次：${escape(before.label)}</div>${renderValue(before.value)}</div>
				<div><div class="hint">这一次：${after ? escape(after.label) : '（没有这一项）'}</div>${after ? renderValue(after.value) : ''}</div></div></details>`);
		}
		if (change?.kind === 'removed') {
			html.push(`<details><summary>上一次有、这一次没有的 ${change.count} 项</summary>${comparison.before.map(item => `<div class="detail"><div class="hint">${escape(item.label)}</div>${renderValue(item.value)}</div>`).join('')}</details>`);
		}
	}

	// 模型看到的顺序：先是工具列表，再是输入。缓存从第一处不同的地方断开，之后的都命中不了。
	html.push(`<h2>请求内容（约 ${tokens(request.totalTokens)} token）</h2>`);
	const change = comparison?.change;
	const toolsChanged = !!comparison && request.toolSet !== previous.toolSet;
	if (comparison) {
		const first = toolsChanged ? '变了的工具' : !change ? '后面追加的' : change.kind === 'inserted' ? '多出来的' : change.kind === 'removed' ? '原来那几项的位置' : '变了的';
		html.push(`<div class="legend"><span class="l-same">和上一次一样</span><span class="${toolsChanged || change ? 'l-bad' : 'l-first'}">${first}</span><span class="l-after">之后的</span></div>`);
	}

	const tools = DATA.toolSets[request.toolSet];
	const previousTools = new Map((previous ? DATA.toolSets[previous.toolSet] : []).map(tool => [tool.name, JSON.stringify(tool)]));
	html.push(`<div class="section">工具列表（${tools.length} 个，约 ${tokens(request.toolsTokens)} token）</div>`);
	tools.forEach((tool, index) => {
		let state = '';
		if (comparison) {
			const differs = previousTools.get(tool.name) !== JSON.stringify(tool);
			state = !toolsChanged || index < comparison.sameTools ? 'same' : differs ? 'first bad' : 'after';
		}
		html.push(`<div class="row ${state}" data-tool="${index}"><span class="n"></span><span class="text"><b>${escape(tool.name)}</b> <span class="muted">${escape(tool.description.split('\n')[0])}</span></span></div>`);
		html.push(`<div class="detail" id="tool-${index}" hidden></div>`);
	});

	// 输入里第一处不同标出来：多出来的几项都标，别的情况标一项。工具列表变了时输入都在它之后。
	const marked = change?.kind === 'inserted' ? change.count : 1;
	let section = null;
	request.items.forEach((item, index) => {
		if (item.section !== section) {
			section = item.section;
			html.push(`<div class="section">${SECTION_NAMES[section]}</div>`);
		}
		let state = '';
		if (comparison) state = toolsChanged ? 'after' : index < comparison.same ? 'same' : index < comparison.same + marked ? `first${change ? ' bad' : ''}` : 'after';
		html.push(`<div class="row ${state}" data-item="${index}"><span class="n">${index + 1}</span><span class="text">${item.summary ? summaryInfo(item.summary) : ''}${escape(item.label)}</span><span class="tokens">${tokens(item.tokens)}</span></div>`);
		html.push(`<div class="detail" id="item-${index}" hidden></div>`);
	});

	html.push('<h2>其他参数</h2>');
	html.push(`<div class="box kv">${Object.entries(request.params).map(([key, value]) => `<code${comparison?.params.includes(key) ? ' class="changed"' : ''}>${escape(key)}</code><div>${renderValue(value)}</div>`).join('')}</div>`);

	html.push('<h2>模型这次返回</h2>');
	html.push(`<div class="box"><ul>${request.output.map(line => `<li>${escape(line)}</li>`).join('')}</ul></div>`);

	main.innerHTML = html.join('');
	main.scrollTop = 0;
}

function select(sampleIndex, requestIndex) {
	selected = [sampleIndex, requestIndex];
	history.replaceState(null, '', `#${DATA.samples[sampleIndex].name}/${requestIndex + 1}`);
	renderSide();
	renderMain();
	document.querySelector('.request.selected')?.scrollIntoView({ block: 'nearest' });
}

document.getElementById('side').addEventListener('click', event => {
	const row = event.target.closest('.request[data-sample]');
	if (row) select(Number(row.dataset.sample), Number(row.dataset.request));
});

document.getElementById('main').addEventListener('click', event => {
	const row = event.target.closest('.row');
	if (!row) return;
	const request = DATA.samples[selected[0]].requests[selected[1]];
	const isTool = row.dataset.tool !== undefined;
	const index = Number(isTool ? row.dataset.tool : row.dataset.item);
	const detail = document.getElementById(`${isTool ? 'tool' : 'item'}-${index}`);
	if (!detail.hidden) {
		detail.hidden = true;
		return;
	}
	detail.innerHTML = renderValue(isTool ? DATA.toolSets[request.toolSet][index] : request.items[index].value);
	detail.hidden = false;
});

/** 上下键在请求之间移动。 */
document.addEventListener('keydown', event => {
	if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
	const all = DATA.samples.flatMap((sample, sampleIndex) => sample.requests.map(request => [sampleIndex, request.index]));
	const current = selected ? all.findIndex(([sampleIndex, requestIndex]) => sampleIndex === selected[0] && requestIndex === selected[1]) : -1;
	const next = all[Math.min(all.length - 1, Math.max(0, current + (event.key === 'ArrowDown' ? 1 : -1)))];
	if (!next) return;
	event.preventDefault();
	select(next[0], next[1]);
});

/** 地址里写着 #情景名/第几次请求 时选中它。 */
function selectFromHash() {
	const [name, number] = decodeURIComponent(location.hash.slice(1)).split('/');
	const sampleIndex = DATA.samples.findIndex(sample => sample.name === name);
	if (sampleIndex !== -1 && DATA.samples[sampleIndex].requests[Number(number) - 1]) select(sampleIndex, Number(number) - 1);
	else {
		renderSide();
		renderMain();
	}
}
window.addEventListener('hashchange', selectFromHash);
selectFromHash();
</script>
</body>
</html>
