name: 功能建议
description: 想要的能力、觉得不好用的地方
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 现在哪里不顺手
      description: 说清你想解决的事情，而不是先给方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你想怎么做
      description: 有想法就写；没有也行，说说期望的效果
  - type: textarea
    id: alternatives
    attributes:
      label: 试过或考虑过的其他办法
